[package]
name = "powernotd"
version = "1.3.0"
edition = "2024"
authors = ["laeri@laeri.me"]
readme = "README.md"
repository = "https://github.com/Laeri/powernotd"
homepage = "https://github.com/Laeri/powernotd"
license = "MIT"
keywords = ["battery", "notification", "daemon"]
categories = ["command-line-utilities"]
build = "build.rs"
publish = true
description = "Powernotd is a battery-level notification daemon that sends notification using the xdg desktop notification standard."
exclude = [
  "assets/powernotd_screenshot.png"
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
notify-rust = "4.17.0"
serde = {version =  "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
shell-words = "1.1.1"
zbus = "5"

[build-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_mangen = "0.3.0"
clap_complete = "4.6.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
